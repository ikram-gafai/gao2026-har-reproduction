# UCI HAR acquisition sources and integrity expectations.
# Dataset: "Human Activity Recognition Using Smartphones", Reyes-Ortiz et al., UCI Machine Learning Repository,
# DOI 10.24432/C54S4K, licence CC BY 4.0.
# All checksums were established on 2026-11-25. The official static ZIP and the Internet Archive capture
# were byte-identical, and the inner archive matched the official legacy-path file
# (see docs/DATA.md for the evidence).

dataset_doi = "10.24432/C54S4K"
landing_page = "https://archive.ics.uci.edu/dataset/240/human+activity+recognition+using+smartphones"

# Archive kinds:
#   "outer": the current official UCI download, containing 'UCI HAR Dataset.zip' plus a .names file
#   "inner": 'UCI HAR Dataset.zip' itself
[expected]
outer_sha256 = "c00b803081a5c797cd5e4b83700a9810b38d53d9d84e01917e090e1fdbc81031"
outer_bytes = 61005872
inner_sha256 = "2045e435c955214b38145fb5fa00776c72814f01b203fec405152dac7d5bfeb0"
inner_bytes = 60999314
inner_member_name = "UCI HAR Dataset.zip"
dataset_dirname = "UCI HAR Dataset"

# Sources are tried in this order. A download is accepted only if its SHA-256 matches the expected hash for its kind.
# Measured throughput on 2026-11-25: legacy path about 63 KB/s, static URL 4-17 KB/s, Internet Archive about 500 KB/s.
[[sources]]
name = "uci-legacy-path"
kind = "inner"
url = "https://archive.ics.uci.edu/ml/machine-learning-databases/00240/UCI%20HAR%20Dataset.zip"

[[sources]]
