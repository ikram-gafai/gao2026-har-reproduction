[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "har-repro"
version = "0.1.0"
description = "Independent fixed-configuration reproduction of Gao et al. (2026) compact vs full XGBoost results on UCI HAR"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Code licence. The UCI HAR data and the paper's Supplementary Table S2 keep their own CC BY 4.0 licences (see README).
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy==2.4.6",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "xgboost==3.2.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "data: requires the prepared, checksum-verified UCI HAR dataset (run `python -m har_repro.cli prepare-data` first)",
]
